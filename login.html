<!doctype html>
<html lang="es">
  <head>
    <title>DevJobs - Login</title>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Encuentra las mejores ofertas de trabajo para desarrolladores en DevJobs."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <header>
      <h1>
        <svg
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        DevJobs
      </h1>

      <nav>
        <a href="./index.html">Inicio</a>
        <a href="">Companies</a>
        <a href="">About</a>
      </nav>

      <div>
        <a href="">Post a job</a>
        <a href="" style="background-color: var(--primary-hover)">Sign In</a>
      </div>
    </header>

    <!-- Contenedor general enfocado al diseño de login -->
    <main class="login-page">
      <section class="login-card">
        <h1>Welcome Back</h1>
        <p>Log in to find your next opportunity.</p>

        <form id="login-form">
          <div class="email-form-input auth-input-group">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="icon-tabler-mail"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path
                d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10"
              />
              <path d="M3 7l9 6l9 -6" />
            </svg>
            <input required type="email" id="email" placeholder="Email" />
          </div>

          <div class="password-form-input auth-input-group">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="icon-tabler-lock"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path
                d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6"
              />
              <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />
              <path d="M8 11v-4a4 4 0 1 1 8 0v4" />
            </svg>
            <input
              required
              type="password"
              id="password"
              placeholder="Password"
            />
          </div>

          <div class="checkbox-form">
            <div class="remember-me-group">
              <input type="checkbox" id="remember-me" />
              <label for="remember-me">Remember me</label>
            </div>
            <a href="" class="forgot-password-link">Forgot password?</a>
          </div>

          <button type="submit" class="login-button">Log In</button>
        </form>

        <div class="signup-section">
          <div class="signup-separator">Don't have an account?</div>
          <div class="signup-button-container">
            <a href="" class="signup-alt-btn">Sign up as a developer</a>
            <a href="" class="signup-alt-btn">Sign up as a company</a>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <small>&copy; 2026 DevJobs. Todos los derechos reservados.</small>
    </footer>
  </body>
</html>
